# Cloudflare Pages config. Per-environment values (ENVIRONMENT, SUPABASE_URL,
# SUPABASE_ANON_KEY) are set on each Pages project by .github/scripts/deploy.sh,
# because each project deploys `main` as its production environment (D21).
# Local values live in apps/web/.dev.vars (git-ignored; see .dev.vars.example).
name = "feedcal-web"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
