<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#f6f6f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1d1d1b;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;">
      <tr>
        <td style="padding:32px;">
          <p style="margin:0 0 8px;font-size:14px;color:#5c5c58;">Calantern</p>
          <h1 style="margin:0 0 16px;font-size:22px;line-height:1.3;">Sign in to Calantern</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">Tap the button to finish signing in. The link works once and expires in 15 minutes.</p>
          <p style="margin:0 0 24px;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email"
               style="display:inline-block;padding:12px 20px;background:#1f5f3f;color:#ffffff;text-decoration:none;border-radius:8px;font-size:16px;font-weight:600;">Sign in</a>
          </p>
          <p style="margin:0;font-size:14px;line-height:1.5;color:#5c5c58;">If you didn't ask for this, you can ignore this email. No one can sign in without the link.</p>
        </td>
      </tr>
    </table>
  </body>
</html>
