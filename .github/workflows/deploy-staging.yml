name: Deploy staging
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event.workflow_run.head_sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - run: npx supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions (if any)
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            npx supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "No Edge Functions yet."
          fi
      - run: npm run build -w @feedcal/web
      - run: npx wrangler pages deploy apps/web/dist --project-name feedcal-web-staging --branch main --commit-hash "$GITHUB_SHA"
      - name: Smoke test /health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.STAGING_URL }}/health"
