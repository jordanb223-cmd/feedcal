name: Deploy production
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The "production" environment requires the owner's approval and only accepts v* tags.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      ENVIRONMENT: production
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      PAGES_PROJECT: feedcal-web
      SITE_URL: ${{ vars.PRODUCTION_URL }}
      DEPLOY_SHA: ${{ github.sha }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      BMC_USERNAME: ${{ vars.BMC_USERNAME }}
      GMAIL_CLIENT_ID: ${{ vars.GMAIL_CLIENT_ID }}
      # Per environment (Settings → Environments → production → variables): "on" once Google is set up.
      GOOGLE_SIGN_IN: ${{ vars.GOOGLE_SIGN_IN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fail if CHANGELOG.md has no entry for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qF "## [${version}]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [${version}]' section. Add one, then tag again."; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      # D58: Supabase's free plan keeps no backups of its own, so take one right before any change.
      # If it can't be taken, production isn't touched. Restore with scripts/restore-drill.sh.
      - name: Back up production before changing it
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_DB_URL or BACKUP_PASSPHRASE isn't set. Refusing to change production without a fresh backup."; exit 1
          fi
          scripts/backup.sh backups-predeploy "$BACKUP_DB_URL"
      - name: Keep the pre-deploy backup for 90 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "backup-predeploy-${{ github.ref_name }}-${{ github.run_id }}", path: backups-predeploy/, retention-days: 90, if-no-files-found: error }
      - name: Tell the database a backup was stored
        env:
          BACKUP_DB_URL: ${{ secrets.BACKUP_DB_URL }}
        run: scripts/backup-heartbeat.sh "$BACKUP_DB_URL" predeploy "$(ls backups-predeploy/*.enc | head -1)"
      - run: .github/scripts/deploy.sh
