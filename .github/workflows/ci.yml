name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run lint
      # D57/D58: a pull request that adds a migration which deletes data fails here, with a WARNING
      # naming the file, until "-- destructive: reviewed" is added after a person has checked it.
      - name: Flag new migrations that delete data
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git ls-tree --name-only FETCH_HEAD supabase/migrations/ | sed 's#.*/##' | cut -d_ -f1 \
            | .github/scripts/migration-guard.sh supabase/migrations "production (once released)"
      - run: npm run typecheck
      - run: npm test
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - run: npm run test:functions
      - run: npm run build
      - run: npm audit --audit-level=high

  database:
    name: Migrations, pgTAP, generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      # A throwaway signing secret for the local ingest functions (integration tests only).
      - run: printf 'INGEST_HMAC_SECRET=%s\nMAILPIT_URL=http://supabase_inbucket_feedcal:8025\nSITE_URL=http://localhost:8788\nBMC_WEBHOOK_SECRET=%s\nBMC_ACCEPT_TEST_EVENTS=true\n' "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > supabase/functions/.env
      - run: npx supabase start -x studio,imgproxy,logflare,vector,supavisor
      - run: npx supabase db reset
      - run: npx supabase test db
      - name: Integration tests against the local stack (real sessions and RLS)
        run: npm run test:integration
      - name: Fail if generated database types are stale
        run: |
          npx supabase gen types typescript > packages/shared/src/database.types.ts
          git diff --exit-code -- packages/shared/src/database.types.ts
      - name: Fail if generated state machines are stale
        run: |
          npm run db:states
          git diff --exit-code -- packages/shared/src/state-machines.generated.ts docs/STATE-MACHINES.md

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # gitleaks CLI over the full history. (gitleaks-action scans only the pushed range,
      # which breaks on a repo's first push: the root commit has no parent.)
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --no-banner --verbose .
